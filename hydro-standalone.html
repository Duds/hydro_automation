<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hydroponic Control System</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e27;font-family:'JetBrains Mono','Courier New',monospace;color:#e0e0e0;overflow:hidden}
:root{--cyan:#00d9ff;--magenta:#ff006e;--lime:#00ff88;--bg:#0a0e27;--bg2:#0f1535;--bg3:#141a3a;--text:#e0e0e0}
@keyframes pulse-cyan{0%,100%{box-shadow:0 0 6px var(--cyan),0 0 12px var(--cyan)}50%{box-shadow:0 0 14px var(--cyan),0 0 28px var(--cyan),0 0 40px var(--cyan)}}

@keyframes toast-out{to{transform:translateY(-40px);opacity:0}}

@keyframes flash-white{0%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 40px rgba(255,255,255,0.8)}100%{box-shadow:0 0 0 rgba(255,255,255,0)}}
@keyframes stagger-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes entry-highlight{0%{background:rgba(0,217,255,0.2)}100%{background:transparent}}

.panel-running{animation:pulse-cyan 1.5s ease-in-out infinite}
.device-on{animation:pulse-magenta 2s ease-in-out infinite}
.btn{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:1px solid;background:transparent;padding:10px 18px;transition:all .15s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.3)}
.btn:active{transform:scale(.95) translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-cyan{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.btn-cyan:hover{box-shadow:0 0 16px var(--cyan),0 0 30px rgba(0,217,255,.4)}
.btn-magenta{color:var(--magenta);border-color:var(--magenta);box-shadow:0 0 8px var(--magenta)}
.btn-magenta:hover{box-shadow:0 0 16px var(--magenta),0 0 30px rgba(255,0,110,.4)}
.btn-lime{color:var(--lime);border-color:var(--lime);box-shadow:0 0 8px var(--lime)}
.btn-lime:hover{box-shadow:0 0 16px var(--lime),0 0 30px rgba(0,255,136,.4)}
.spinner{animation:spin 1.5s linear infinite;display:inline-block}
.log-entry{animation:slide-in-bottom .3s ease,entry-highlight .4s ease}
.log-entry:hover{background:rgba(0,217,255,0.05)!important}
.skeleton{background:var(--bg3);position:relative;overflow:hidden;border-radius:2px}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,217,255,.1),transparent);animation:shimmer 1.5s infinite}
.section-header{font-size:10px;letter-spacing:.3em;color:var(--cyan);text-shadow:0 0 8px var(--cyan);border-bottom:1px solid var(--cyan);padding-bottom:6px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,217,255,.2)}
.app-content{min-height:0;overflow:hidden}
.log-panel-outer{min-height:0;overflow:hidden;height:100%}
.log-panel-inner{min-height:0;overflow-y:auto;overflow-x:hidden}
</style>
</head>

      createElement("div", { style: { background: "#0f1535", padding: 20 }, className: "neon-cyan" },
        createElement("div", { className: "section-header" }, "\u25C8 CONTROLS"),
        createElement("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, btns)
      ),
      createElement("div", { style: { background: "#0f1535", padding: 20 }, className: "neon-lime" },
        createElement("div", { className: "section-header", style: schedHeaderStyle }, "\u25C8 SCHEDULE"),

  }
